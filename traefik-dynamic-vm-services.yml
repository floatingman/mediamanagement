# Traefik dynamic config: proxy VM-hosted services (192.168.0.7) through LXC Traefik
# Single front door: DNS (*.thenewmans.casa) -> LXC Traefik -> VM services / VM authelia

http:
  middlewares:
    authelia-forwardauth:
      forwardAuth:
        address: "http://192.168.0.7:9091/api/authz/forward-auth"
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

  routers:
    auth:
      rule: "Host(`auth.thenewmans.casa`)"
      service: authelia
      tls:
        certResolver: letsencrypt
    radarr:
      rule: "Host(`radarr.thenewmans.casa`)"
      service: radarr
      tls:
        certResolver: letsencrypt
    sonarr:
      rule: "Host(`sonarr.thenewmans.casa`)"
      service: sonarr
      tls:
        certResolver: letsencrypt
    lidarr:
      rule: "Host(`lidarr.thenewmans.casa`)"
      service: lidarr
      tls:
        certResolver: letsencrypt
    bazarr:
      rule: "Host(`bazarr.thenewmans.casa`)"
      service: bazarr
      tls:
        certResolver: letsencrypt
    profilarr:
      rule: "Host(`profilarr.thenewmans.casa`)"
      service: profilarr
      tls:
        certResolver: letsencrypt
    titlecardmaker:
      rule: "Host(`titlecardmaker.thenewmans.casa`)"
      service: titlecardmaker
      tls:
        certResolver: letsencrypt
    linkwarden:
      rule: "Host(`linkwarden.thenewmans.casa`)"
      service: linkwarden
      tls:
        certResolver: letsencrypt
    sabnzbd:
      rule: "Host(`sabnzbd.thenewmans.casa`)"
      service: sabnzbd
      tls:
        certResolver: letsencrypt
    torrent:
      rule: "Host(`torrent.thenewmans.casa`)"
      service: qbittorrent
      tls:
        certResolver: letsencrypt
    convertx:
      rule: "Host(`convertx.thenewmans.casa`)"
      service: convertx
      tls:
        certResolver: letsencrypt
    zipline:
      rule: "Host(`zipline.thenewmans.casa`)"
      service: zipline
      tls:
        certResolver: letsencrypt
    minecraft:
      rule: "Host(`minecraft.thenewmans.casa`)"
      service: mcsmanager-web
      tls:
        certResolver: letsencrypt
    romm:
      rule: "Host(`romm.thenewmans.casa`)"
      service: romm
      tls:
        certResolver: letsencrypt

  services:
    authelia:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:9091"
    radarr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:7878"
    sonarr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:8989"
    lidarr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:8686"
    bazarr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:6767"
    profilarr:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:6868"
    titlecardmaker:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:4242"
    linkwarden:
      loadBalancer:
        servers:
          - url: "http://192.168.0.7:3002"
    sabnzbd:
      loadBalancer:
