services:
  covertx:
    image: ghcr.io/c4illin/convertx
    container_name: convertx
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - UMASK=022
      - JWT_SECRET=${CONVERTX_JWT_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.services.convertx.loadbalancer.server.port=3000
      - traefik.http.routers.convertx.rule=Host(`convertx.thenewmans.casa`)
    volumes:
      - ../appdata/convertx:/app/data
    ports:
      - 3000:3000
    restart: unless-stopped

  zipline-db:
    image: postgres:16-alpine
    container_name: zipline-db
    environment:
      - POSTGRES_USER=zipline
      - POSTGRES_PASSWORD=${ZIPLINE_DB_PASSWORD}
      - POSTGRES_DB=zipline
    volumes:
      - ../appdata/zipline/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zipline']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zipline:
    image: ghcr.io/diced/zipline:latest
    container_name: zipline
    environment:
      - TZ=${TZ:-America/Chicago}
      - DATABASE_URL=postgres://zipline:${ZIPLINE_DB_PASSWORD}@zipline-db:5432/zipline
      - CORE_SECRET=${ZIPLINE_CORE_SECRET}
    labels:
      - traefik.enable=true
      - traefik.http.services.zipline.loadbalancer.server.port=3000
      - traefik.http.routers.zipline.rule=Host(`zipline.thenewmans.casa`)
    volumes:
      - ../appdata/zipline/uploads:/zipline/uploads
      - ../appdata/zipline/public:/zipline/public
      - ../appdata/zipline/themes:/zipline/themes
    ports:
      - 3001:3000
    depends_on:
      zipline-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/healthcheck']
      interval: 15s
      timeout: 2s
      retries: 2
    restart: unless-stopped

  syncthing:
    image: ghcr.io/linuxserver/syncthing
    container_name: syncthing
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.syncthing.loadbalancer.server.port=8384
      - traefik.http.routers.syncthing.rule=Host(`sync.thenewmans.casa`)
    volumes:
      - ../appdata/syncthing:/config
      # Synced drop folders consumed by the *arr stack: Sync/nzb → SABnzbd
      # watch dir (/watch), Sync/torrent → qBittorrent watch dir (/watch).
      - ../../syncs/Sync:/sync
    ports:
      - 8384:8384 # Web GUI (also at sync.thenewmans.casa)
      - 22000:22000/tcp # Sync protocol
      - 22000:22000/udp # QUIC
      - 21027:21027/udp # Local discovery broadcasts
    restart: unless-stopped

  # Self-hosted meta-search engine. Open (no Authelia) by design so it can
  # serve as browser default search + JSON API for tools; the SearXNG bot
  # limiter backed by valkey is the abuse protection.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080
      - traefik.http.routers.searxng.rule=Host(`search.thenewmans.casa`)
    volumes:
      - ../appdata/searxng/config:/etc/searxng
      - ../appdata/searxng/cache:/var/cache/searxng
    depends_on:
      - searxng-valkey
    restart: unless-stopped

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ../appdata/searxng/valkey:/data
    restart: unless-stopped
