# VM-resident tier only. Migrated to k8s: convertx + zipline (+db) → ns apps,
# syncthing → ns media (hostPort 22000, owns the migrated device identity).
services:
  # Self-hosted meta-search engine. Open (no Authelia) by design so it can
  # serve as browser default search + JSON API for tools; the SearXNG bot
  # limiter backed by valkey is the abuse protection.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.searxng.loadbalancer.server.port=8080
      - traefik.http.routers.searxng.rule=Host(`search.thenewmans.casa`)
    volumes:
       - ../appdata/searxng/config:/etc/searxng
       - ../appdata/searxng/cache:/var/cache/searxng
    ports:
      - "8082:8080" # published for the k8s edge (permanent — never migrates, GPU-bound via perplexica)
    depends_on:
      - searxng-valkey
    restart: unless-stopped

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - ../appdata/searxng/valkey:/data
    restart: unless-stopped

  # OpenAI-shape proxy for the Cline API (api.cline.bot): Cline wraps every
  # completion in {"data": ..., "success": ...}, which litellm/cognee cannot
  # parse. Stdlib-only script; forwards auth verbatim. Port 8123.
  cline-gateway:
    image: python:3.12-slim
    container_name: cline-gateway
    command: python /gateway/cline-gateway.py
    volumes:
      - ../scripts/cline-gateway.py:/gateway/cline-gateway.py:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
