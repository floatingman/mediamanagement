services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    # Host networking is REQUIRED for remote access: Docker bridge NAT traps
    # UPnP/NAT-PMP inside the bridge, so plex.tv never sees the real IP. Plex
    # binds host ports directly (32400 main; 32469/1900 DLNA) and is NOT
    # behind Traefik — reach it via https://app.plex.tv or
    # http://<host-ip>:32400. Open 32400/tcp inbound on the router for remote
    # access. NVENC hardware transcoding (Plex Pass) needs runtime: nvidia
    # plus the `video` capability below; without it transcoding silently fails.
    network_mode: host
    runtime: nvidia
    environment:
      # Must match the UID/GID owning the Plex data dir (the migrated native
      # install ran as 999:996). Override via PLEX_PUID / PLEX_PGID in .env.
      - PUID=${PLEX_PUID:-999}
      - PGID=${PLEX_PGID:-996}
      - TZ=${TZ:-America/Chicago}
      - NVIDIA_VISIBLE_DEVICES=all
      # REQUIRED for NVENC hardware transcoding: the `runtime: nvidia` default
      # only injects compute+utility. `video` exposes the NVENC/NVDEC codec
      # libs; without it Plex Pass hardware transcoding silently fails.
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # Only needed to claim a BRAND-NEW server — migrated data carries its
      # identity in Preferences.xml. Token: https://www.plex.tv/claim/
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      # Data dir (config + DBs + Metadata + Media store) mounted at BOTH paths:
      # /config is where linuxserver/plex looks for it; /var/lib/plexmediaserver
      # is the absolute path baked into the existing library DBs. Relocate via
      # PLEX_DATA_PATH in .env.
      - ${PLEX_DATA_PATH:-/var/lib/plexmediaserver}:/config
      - ${PLEX_DATA_PATH:-/var/lib/plexmediaserver}:/var/lib/plexmediaserver
      # Media libraries bound at identical host paths so DB locations resolve.
      - /mnt/perceptormedia:/mnt/perceptormedia
      - /mnt/perceptormediaexpansion:/mnt/perceptormediaexpansion
      - /mnt/ratchetmedia:/mnt/ratchetmedia
      - /mnt/downloads:/mnt/downloads
      # Keep transcodes on fast host tmp instead of inside the (huge) data dir.
      - /tmp:/transcode
    # No Traefik labels — Plex is reached via app.plex.tv / host IP, not a subdomain.
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - PORT=5055
    labels:
      - traefik.enable=true
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      - traefik.http.routers.seerr.rule=Host(`seerr.thenewmans.casa`)
    ports:
      - 5055:5055
    volumes:
      - ../appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  tautulli:
    image: tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - ../appdata/tautulli:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.tautulli.loadbalancer.server.port=8181
      - traefik.http.routers.tautulli.rule=Host(`tautulli.thenewmans.casa`)
    ports:
      # LAN access on host 8182 — 8181 is reserved for gluetun/qbittorrent (vpn service)
      - 8182:8181

  agregarr:
    image: agregarr/agregarr:latest
    container_name: agregarr
    volumes:
      - ../appdata/agregarr:/app/config
      - /mnt/perceptormedia/placeholders/movies:/data/movies
      - /mnt/perceptormedia/placeholders/tv:/data/tv
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.agregarr.loadbalancer.server.port=7171
      - traefik.http.routers.agregarr.rule=Host(`agregarr.thenewmans.casa`)
    ports:
      - 7171:7171
    restart: unless-stopped

  tunarr:
    image: chrisbenincasa/tunarr:latest
    container_name: tunarr
    ports:
      - ${TUNARR_SERVER_PORT:-8000}:8000
    runtime: nvidia
    environment:
      - LOG_LEVEL=${TUNARR_LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Chicago}
      - NVIDIA_VISIBLE_DEVICES=all
    labels:
      - traefik.enable=true
      - traefik.http.services.tunarr.loadbalancer.server.port=8000
      - traefik.http.routers.tunarr.rule=Host(`tunarr.thenewmans.casa`)
      - traefik.http.routers.tunarr.middlewares=authelia@docker
    volumes:
      # Lives on the fast local data disk (with the Plex store) — tunarr's ~11G of
      # DB + meilisearch index + image cache saturates the slow root virtual disk
      # during library scans, wedging the whole VM's I/O.
      - /var/lib/plexmediaserver/tunarr-data:/config/tunarr
    restart: unless-stopped

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ../appdata/cleanuparr:/config
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - UMASK=022
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.thenewmans.casa`)

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: "${PUID:-1000}:${PGID:-1003}"
    volumes:
      - type: bind
        source: ../appdata/maintainerr
        target: /opt/data
    environment:
      - TZ=${TZ:-America/Chicago}
      # PAT raises the GitHub API rate limit (60/hr -> 5000/hr)
      - GITHUB_TOKEN=${MAINTAINERR_GITHUB_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.services.maintainerr.loadbalancer.server.port=6246
      - traefik.http.routers.maintainerr.rule=Host(`maintainerr.thenewmans.casa`)
    ports:
      - 6246:6246
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1003}"
    ports:
      - 13378:80
    volumes:
      - /mnt/perceptormediaexpansion/Audio/audiobooks:/audiobooks
      - /mnt/perceptormediaexpansion/Audio/podcasts:/podcasts
      - ../appdata/audiobookshelf/config:/config
      - ../appdata/audiobookshelf/data:/metadata
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.thenewmans.casa`)

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - DOCKER_MODS=linuxserver/mods:universal-calibre # adds calibre ebook-convert binary; remove for lightweight image
    labels:
      - traefik.enable=true
      - traefik.http.services.calibre-web.loadbalancer.server.port=8083
      - traefik.http.routers.calibre-web.rule=Host(`calibre.thenewmans.casa`)
    ports:
      - "8083:8083"
    volumes:
      - ../appdata/calibre-web/config:/config
      - ../appdata/calibre-web/config/custom-cont-init.d:/custom-cont-init.d # s6 v3 baseimage runs boot scripts from here (kepubify alias for calibre-web 0.6.27 binary-name check)
      - /mnt/backups/Books:/books
    restart: unless-stopped
