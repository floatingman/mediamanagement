services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    # ---------------------------------------------------------------------------
    # HOST NETWORKING (network_mode: host): Plex binds directly to the host's
    # interfaces, sitting on the LAN IP (192.168.0.9) like the native install.
    # This is REQUIRED for remote access via UPnP auto port-mapping, because
    # Docker bridge NAT traps UPnP multicast + NAT-PMP inside the bridge
    # (plex.tv was only ever seeing the container's private 172.x IP).
    # Access Plex via https://app.plex.tv or http://<host-ip>:32400.
    # NOT behind Traefik — no plex.thenewmans.casa subdomain.
    #
    # Hardware transcoding via NVIDIA NVENC (GTX 1660 on this host). Requires
    # Plex Pass. On a host WITHOUT nvidia-container-toolkit, delete the
    # `runtime:` line and the NVIDIA_VISIBLE_DEVICES line below.
    # ---------------------------------------------------------------------------
    network_mode: host
    runtime: nvidia
    environment:
      # Must match the UID/GID that owns the Plex data dir. This server's native
      # install ran as `plex` (999:996); a fresh server often uses 1000:1003.
      # Override via PLEX_PUID / PLEX_PGID in .env (defaults match this server).
      - PUID=${PLEX_PUID:-999}
      - PGID=${PLEX_PGID:-996}
      - TZ=${TZ:-America/Chicago}
      - NVIDIA_VISIBLE_DEVICES=all
      # REQUIRED for NVENC hardware transcoding: the `runtime: nvidia` default
      # only injects compute+utility. `video` exposes the NVENC/NVDEC codec
      # libs; without it Plex Pass hardware transcoding silently fails.
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # Only needed to claim a BRAND-NEW server (no migrated data). With existing
      # data the machine identity already travels in Preferences.xml, so leave blank.
      # Token: https://www.plex.tv/claim/
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    # With host networking, `ports:` is IGNORED — Plex binds host ports directly:
    #   32400/tcp  (main web UI + apps + remote access)
    #   32469/tcp + 1900/udp  (DLNA, if enabled in Plex settings)
    #   3005/tcp (Companion/GDM), 8324/tcp (Roku)
    # Firewall: open 32400/tcp inbound on the host/router for remote access.
    volumes:
      # Plex config + library DBs + Metadata + the 605G Media store. Mounted at
      # BOTH paths on purpose:
      #   /config                    -> where linuxserver/plex looks for the data
      #   /var/lib/plexmediaserver   -> the absolute path already baked into the
      #                                 existing library DB, so media resolves
      # On a new server, set PLEX_DATA_PATH in .env to wherever the data lives.
      - ${PLEX_DATA_PATH:-/var/lib/plexmediaserver}:/config
      - ${PLEX_DATA_PATH:-/var/lib/plexmediaserver}:/var/lib/plexmediaserver
      # Media libraries — bound at their IDENTICAL host paths so the existing
      # library DB locations resolve unchanged after migration.
      - /mnt/perceptormedia:/mnt/perceptormedia
      - /mnt/perceptormediaexpansion:/mnt/perceptormediaexpansion
      - /mnt/ratchetmedia:/mnt/ratchetmedia
      - /mnt/downloads:/mnt/downloads
      # Keep transcodes on fast host tmp instead of inside the (huge) data dir.
      - /tmp:/transcode
    # No Traefik labels — Plex is reached via app.plex.tv / host IP, not a subdomain.
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - PORT=5055 #optional
    labels:
      - traefik.enable=true
      - traefik.http.services.seerr.loadbalancer.server.port=5055
      - traefik.http.routers.seerr.rule=Host(`seerr.thenewmans.casa`)
    ports:
      - 5055:5055
    volumes:
      - ../appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  tautulli:
    image: tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - ../appdata/tautulli:/config
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.tautulli.loadbalancer.server.port=8181
      - traefik.http.routers.tautulli.rule=Host(`tautulli.thenewmans.casa`)
    ports:
      - 8181:8181

  agregarr:
    image: agregarr/agregarr:latest
    container_name: agregarr
    volumes:
      - ../appdata/agregarr:/app/config
      - /mnt/perceptormedia/placeholders/movies:/data/movies
      - /mnt/perceptormedia/placeholders/tv:/data/tv
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.agregarr.loadbalancer.server.port=7171
      - traefik.http.routers.agregarr.rule=Host(`agregarr.thenewmans.casa`)
    ports:
      - 7171:7171
    restart: unless-stopped

  tunarr:
    image: chrisbenincasa/tunarr:latest
    container_name: tunarr
    ports:
      - ${TUNARR_SERVER_PORT:-8000}:8000
    # Uncomment if using the Nvidia container
    runtime: nvidia
    environment:
      - LOG_LEVEL=${TUNARR_LOG_LEVEL:-INFO}
      # Replace this with your timezone to ensure accurate guide
      # data and scheduling.
      - TZ=${TZ:-America/Chicago}
      # Uncomment if you'd like to adjust default config path
      # - TUNARR_DATABASE_PATH=/your/path/tunarr
      - NVIDIA_VISIBLE_DEVICES=all
    labels:
      - traefik.enable=true
      - traefik.http.services.tunarr.loadbalancer.server.port=8000
      - traefik.http.routers.tunarr.rule=Host(`tunarr.thenewmans.casa`)
      - traefik.http.routers.tunarr.middlewares=authelia@docker
    volumes:
      # Choose a path on your host to map to /config/tunarr. This ensures
      # that restarting the container will not delete your settings or DB.
      - ../appdata/tunarr:/config/tunarr
    restart: unless-stopped

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ../appdata/cleanuparr:/config
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - UMASK=022
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.thenewmans.casa`)

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest # or jorenn92/maintainerr:latest
    container_name: maintainerr
    user: "${PUID:-1000}:${PGID:-1003}"
    volumes:
      - type: bind
        source: ../appdata/maintainerr
        target: /opt/data
    environment:
      - TZ=${TZ:-America/Chicago} # Set your timezone
      #      - BASE_PATH=/maintainerr # uncomment if you're serving maintainerr from a subdirectory
      #      - UI_HOSTNAME=:: # uncomment if you want to listen on IPv6 instead (default 0.0.0.0)
      #      - UI_PORT=6247 # uncomment to change the UI port (default 6246)
      - GITHUB_TOKEN=${MAINTAINERR_GITHUB_TOKEN} # Optional: GitHub Personal Access Token for higher API rate limits (60/hr without, 5000/hr with token)
    labels:
      - traefik.enable=true
      - traefik.http.services.maintainerr.loadbalancer.server.port=6246
      - traefik.http.routers.maintainerr.rule=Host(`maintainerr.thenewmans.casa`)
    ports:
      - 6246:6246
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1003}"
    ports:
      - 13378:80
    volumes:
      - /mnt/perceptormediaexpansion/Audio/audiobooks:/audiobooks
      - /mnt/perceptormediaexpansion/Audio/podcasts:/podcasts
      - ../appdata/audiobookshelf/config:/config
      - ../appdata/audiobookshelf/data:/metadata
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.thenewmans.casa`)
