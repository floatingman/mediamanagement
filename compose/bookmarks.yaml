services:
  linkwarden-db:
    image: postgres:16-alpine
    container_name: linkwarden-db
    environment:
      - POSTGRES_PASSWORD=${LINKWARDEN_DB_PASSWORD}
    volumes:
      - ../appdata/linkwarden/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  linkwarden-search:
    image: getmeili/meilisearch:v1.12.8
    container_name: linkwarden-search
    environment:
      - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_MASTER_KEY}
    volumes:
      - ../appdata/linkwarden/meili_data:/meili_data
    restart: unless-stopped

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    environment:
      - DATABASE_URL=postgresql://postgres:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/postgres
      - NEXTAUTH_SECRET=${LINKWARDEN_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://linkwarden.thenewmans.casa/api/v1/auth
      - MEILI_HOST=http://linkwarden-search:7700
      - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_MASTER_KEY}
      - NEXT_PUBLIC_OLLAMA_ENDPOINT_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    labels:
      - traefik.enable=true
      - traefik.http.services.linkwarden.loadbalancer.server.port=3000
      - traefik.http.routers.linkwarden.rule=Host(`linkwarden.thenewmans.casa`)
    volumes:
      - ../appdata/linkwarden/data:/data/data
    depends_on:
      - linkwarden-db
      - linkwarden-search
    restart: unless-stopped

  # Keyboard-first self-hosted bookmark dashboard (no built-in accounts —
  # gated by the Authelia forward-auth middleware, like tunarr).
  nextdash:
    image: ghcr.io/jordibrouwer/nextdash:latest
    container_name: nextdash
    environment:
      - TZ=${TZ:-America/Chicago}
      # Required header on destructive API calls; dashboard supplies it automatically
      - NEXTDASH_WRITE_TOKEN=${NEXTDASH_WRITE_TOKEN}
    labels:
      - traefik.enable=true
      - traefik.http.services.nextdash.loadbalancer.server.port=8080
      - traefik.http.routers.nextdash.rule=Host(`dash.thenewmans.casa`)
      - traefik.http.routers.nextdash.middlewares=authelia@docker
    volumes:
      - ../appdata/nextdash:/app/data
    restart: unless-stopped
