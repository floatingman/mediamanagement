services:
  linkwarden-db:
    image: postgres:16-alpine
    container_name: linkwarden-db
    environment:
      - POSTGRES_PASSWORD=${LINKWARDEN_DB_PASSWORD}
    volumes:
      - ../appdata/linkwarden/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  linkwarden-search:
    image: getmeili/meilisearch:v1.12.8
    container_name: linkwarden-search
    environment:
      - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_MASTER_KEY}
    volumes:
      - ../appdata/linkwarden/meili_data:/meili_data
    restart: unless-stopped

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    environment:
      - DATABASE_URL=postgresql://postgres:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/postgres
      - NEXTAUTH_SECRET=${LINKWARDEN_NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://linkwarden.thenewmans.casa/api/v1/auth
      - MEILI_HOST=http://linkwarden-search:7700
      - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_MASTER_KEY}
      - NEXT_PUBLIC_OLLAMA_ENDPOINT_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}     # from .env (default gemma3:4b)
    labels:
      - traefik.enable=true
      - traefik.http.services.linkwarden.loadbalancer.server.port=3000
      - traefik.http.routers.linkwarden.rule=Host(`linkwarden.thenewmans.casa`)
    volumes:
      - ../appdata/linkwarden/data:/data/data
    depends_on:
      - linkwarden-db
      - linkwarden-search
    restart: unless-stopped
