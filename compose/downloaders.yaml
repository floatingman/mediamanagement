services:
  vpn:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    # Userspace wireguard-go (creates its own TUN via /dev/net/tun, which plain
    # Docker provides). Kernelspace wedged gluetun's supervisor during a
    # healthcheck-triggered VPN restart — teardown hung on the wg interface and
    # the tunnel sat silently dead for hours. Kernelspace was only ever a
    # Proxmox-LXC workaround.
    volumes:
      - ../appdata/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_IMPLEMENTATION=userspace
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_WIREGUARD_PRIVATE_KEY}
      # ProtonVPN server selection — all SERVER_* filters are ANDed.
      - SERVER_CITIES=Chicago
      # Port forwarding via NAT-PMP. You MUST enable "NAT-PMP (Port Forwarding)"
      # when generating your WireGuard config at:
      # https://account.proton.me/u/0/vpn/WireGuard
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
    restart: unless-stopped

  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.thenewmans.casa`)
    volumes:
      - ../appdata/sabnzbd:/config
      - /mnt/downloads:/downloads
      - ../downloads/nzb/incomplete:/incomplete-downloads
      - ../../syncs/Sync/nzb:/watch
    restart: unless-stopped

  torrent:
    image: ghcr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: service:vpn
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - WEBUI_PORT=8181
      # GSP mod: auto-syncs gluetun's forwarded port to qBittorrent's listen port.
      # Requires qBittorrent "Bypass auth for clients on localhost" (WebUI setting)
      # and the apikey in appdata/gluetun/auth/config.toml matching GLUETUN_API_KEY.
      - DOCKER_MODS=ghcr.io/t-anc/gsp-qbittorent-gluetun-sync-port-mod:main
      - GSP_GTN_API_KEY=${GLUETUN_API_KEY}
    depends_on:
      - vpn
    labels:
      - traefik.enable=true
      - traefik.http.services.torrent.loadbalancer.server.port=8181
      - traefik.http.routers.torrent.rule=Host(`torrent.thenewmans.casa`)
    volumes:
      - ../appdata/qbittorrent:/config
      - /mnt/downloads/torrents:/downloads
      - ../../syncs/Sync/torrent:/watch
    restart: unless-stopped
