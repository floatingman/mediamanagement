services:
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - UMASK=022
    labels:
      - traefik.enable=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - traefik.http.routers.radarr.rule=Host(`radarr.thenewmans.casa`)
    volumes:
      - ../appdata/radarr:/config
      - /mnt/perceptormedia/Video/Movies:/media
      - /mnt/ratchetmedia/Movies/:/ratchetmedia
      - /mnt/downloads:/downloads
      - /mnt/downloads/torrents/complete:/torrentdownloads
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:develop
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - UMASK=022
    labels:
      - traefik.enable=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr.rule=Host(`sonarr.thenewmans.casa`)
    volumes:
      - ../appdata/sonarr:/config
      - /mnt/perceptormedia/Video/TV/:/media
      - /mnt/ratchetmedia/TVShows/:/ratchetmedia
      - /mnt/downloads:/downloads
    restart: unless-stopped

  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
      - UMASK=022
    labels:
      - traefik.enable=true
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - traefik.http.routers.lidarr.rule=Host(`lidarr.thenewmans.casa`)
    volumes:
      - ../appdata/lidarr:/config
      - /mnt/perceptormediaexpansion/Audio/music:/media
      - /mnt/downloads:/downloads
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1003}
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - traefik.http.routers.bazarr.rule=Host(`bazarr.thenewmans.casa`)
    volumes:
      - ../appdata/bazarr:/config
      - /mnt/ratchetmedia/Movies:/ratchetmediamovies
      - /mnt/ratchetmedia/TVShows:/ratchetmediatvshows
      - /mnt/perceptormedia/Video/Movies:/Movies
      - /mnt/perceptormedia/Video/TV:/TV
    ports:
      - 6767:6767
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:7.4.0
    container_name: recyclarr
    init: true
    user: "${PUID:-1000}:${PGID:-1003}"
    volumes:
      - ../appdata/recyclarr:/config
    environment:
      - TZ=${TZ:-America/Chicago}

  profilarr:
    image: santiagosayshey/profilarr:beta
    container_name: profilarr
    labels:
      - traefik.enable=true
      - traefik.http.services.profilarr.loadbalancer.server.port=6868
      - traefik.http.routers.profilarr.rule=Host(`profilarr.thenewmans.casa`)
    ports:
      - 6868:6868
    volumes:
      - ../appdata/profilarr:/config
    environment:
      - TZ=${TZ:-America/Chicago}
    restart: unless-stopped

  titlecardmaker:
    image: ghcr.io/titlecardmaker/titlecardmaker-webui:latest
    container_name: titlecardmaker
    environment:
      - TZ=${TZ:-America/Chicago}
    labels:
      - traefik.enable=true
      - traefik.http.services.titlecardmaker.loadbalancer.server.port=4242
      - traefik.http.routers.titlecardmaker.rule=Host(`titlecardmaker.thenewmans.casa`)
    volumes:
      - ../appdata/titlecardmaker:/config
      # TV libraries — aliases mirror Sonarr so episode paths line up with no path mapping:
      - /mnt/perceptormedia/Video/TV:/media
      - /mnt/ratchetmedia/TVShows:/ratchetmedia
    restart: unless-stopped
