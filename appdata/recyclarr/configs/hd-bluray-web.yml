# Recyclarr v8 config — migrated 2026-09-22 from the v7 template-include
# model. The three `include: - template:` directives (quality definition,
# quality profile, custom formats) collapsed into a single guide-backed
# quality profile: v8 pulls profile settings and CF scores directly from
# TRaSH Guides by trash_id. Optional CF tweaks: add trash_ids blocks with
# assign_scores_to (https://recyclarr.dev/reference/configuration/custom-formats/).
radarr:
  hd-bluray-web:
    base_url: !secret radarr_hd_url
    api_key: !secret radarr_hd_apikey

    delete_old_custom_formats: true

    quality_definition:
      type: movie

    quality_profiles:
      # Guide-backed HD Bluray + WEB. `name` anchors adoption of the profile
      # v7 already created in Radarr (drop it to let the guide rename apply).
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
