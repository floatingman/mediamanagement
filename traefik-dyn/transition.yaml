# Interim edge forwards (pre-§9 cutover): hosts already living on the k8s
# cluster but still fronted by the Docker-VM Traefik. Loaded via
# --providers.file.directory=/dyn in compose/infrastructure.yaml (hot-reload
# via --providers.file.watch=true).
#
# Retire this file (and the proxy service) when the router port-forwards for
# 80/443 move to the cluster ingress node (192.168.0.19) — INSTALL.md §9.
http:
  serversTransports:
    k8s-edge-transport:
      # The backend cert is a valid Let's Encrypt cert for the Host name, but
      # the backend URL below is the node IP, so name verification would fail.
      # The hop never leaves the LAN.
      insecureSkipVerify: true
  middlewares:
    authelia:
      # Used by tunarr + perplexica labels (authelia@file) since wave 1.
      # Plain-HTTP LAN hop to the k8s authelia NodePort — retires at §9.
      forwardAuth:
        address: http://192.168.0.19:30991/api/authz/forward-auth
        trustForwardHeader: true
        authResponseHeaders: [Remote-User, Remote-Groups, Remote-Name, Remote-Email]
  routers:
    linkwarden-k8s:
      rule: Host(`linkwarden.thenewmans.casa`)
      entryPoints: [websecure]
      service: k8s-edge
      tls: {certResolver: letsencrypt}
    rancher-mgmt:
      rule: Host(`rancher.thenewmans.casa`)
      entryPoints: [websecure]
      service: rancher-mgmt-vm
      tls: {certResolver: letsencrypt}
    dash-k8s:
      rule: Host(`dash.thenewmans.casa`)
      entryPoints: [websecure]
      service: k8s-edge
      tls: {certResolver: letsencrypt}
    convertx-k8s:
      rule: Host(`convertx.thenewmans.casa`)
      entryPoints: [websecure]
      service: k8s-edge
      tls: {certResolver: letsencrypt}
    zipline-k8s:
      rule: Host(`zipline.thenewmans.casa`)
      entryPoints: [websecure]
      service: k8s-edge
      tls: {certResolver: letsencrypt}
    auth-k8s:
      rule: Host(`auth.thenewmans.casa`)
      entryPoints: [websecure]
      service: k8s-authelia
      tls: {certResolver: letsencrypt}
    # Wave 2 — the *arr stack + companions (IngressRoutes in ns media)
    radarr-k8s:        {rule: Host(`radarr.thenewmans.casa`),        entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    sonarr-k8s:        {rule: Host(`sonarr.thenewmans.casa`),        entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    lidarr-k8s:        {rule: Host(`lidarr.thenewmans.casa`),        entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    bazarr-k8s:        {rule: Host(`bazarr.thenewmans.casa`),        entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    profilarr-k8s:     {rule: Host(`profilarr.thenewmans.casa`),     entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    titlecardmaker-k8s: {rule: Host(`titlecardmaker.thenewmans.casa`), entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    seerr-k8s:         {rule: Host(`seerr.thenewmans.casa`),         entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    tautulli-k8s:      {rule: Host(`tautulli.thenewmans.casa`),      entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    agregarr-k8s:      {rule: Host(`agregarr.thenewmans.casa`),      entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    cleanuparr-k8s:    {rule: Host(`cleanuparr.thenewmans.casa`),    entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    maintainerr-k8s:   {rule: Host(`maintainerr.thenewmans.casa`),   entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    audiobookshelf-k8s: {rule: Host(`audiobookshelf.thenewmans.casa`), entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    sabnzbd-k8s:       {rule: Host(`sabnzbd.thenewmans.casa`),       entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    # torrent serves from the Docker VM again (gluetun-on-k8s healthcheck race;
    # see TROUBLESHOOTING.md) — docker labels route it, no forward needed here.
    sync-k8s:          {rule: Host(`sync.thenewmans.casa`),          entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    romm-k8s:         {rule: Host(`romm.thenewmans.casa`),         entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
    calibre-k8s:      {rule: Host(`calibre.thenewmans.casa`),      entryPoints: [websecure], service: k8s-edge, tls: {certResolver: letsencrypt}}
  services:
    k8s-edge:
      loadBalancer:
        serversTransport: k8s-edge-transport
        servers: [{url: "https://192.168.0.19:443"}]
    k8s-authelia:
      loadBalancer:
        servers: [{url: "http://192.168.0.19:30991"}]
    rancher-mgmt-vm:
      loadBalancer:
        serversTransport: k8s-edge-transport
        servers: [{url: "https://192.168.0.22:443"}]
