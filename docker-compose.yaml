# VM residents only — the permanent GPU tier + edge + the torrent rollback
# (qBittorrent/gluetun serves here until the k8s gluetun startup race is
# solved; see compose/downloaders.yaml and k8s/media/torrent.yaml). Everything
# else lives on the k8s cluster (ns media/apps/auth/linkwarden); the VM
# Traefik still owns 80/443 and forwards migrated subdomains via
# traefik-dyn/transition.yaml until the §9 edge cutover.
#
# Update flow for what's left here:
#   docker compose pull && docker compose up -d
include:
  - compose/infrastructure.yaml   # traefik (edge), cloudflare-ddns
  - compose/media-server.yaml     # plex, tunarr (GPU)
  - compose/ai.yaml               # ollama, perplexica (GPU)
  - compose/utilities.yaml        # searxng + valkey (GPU-bound via perplexica)
  - compose/gaming.yaml           # mcsmanager web/daemon
  - compose/downloaders.yaml      # torrent rollback: gluetun + qbittorrent

services:
  # Host port for the qBittorrent WebUI on the vpn namespace — the k8s
  # selector-less `torrent` Service Endpoints point at this VM:8181.
  vpn:
    ports:
      - "8181:8181"
