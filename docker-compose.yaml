services:
  proxy:
    image: traefik:v2.4 # Review traefik documentation https://doc.traefik.io/traefik/
    container_name: traefik
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=you@example.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
  domain:
    image: ghcr.io/linuxserver/duckdns # Review doc https://github.com/linuxserver/docker-duckdns
    container_name: duckdns
    environment:
      - TZ=America/Chicago
      - TOKEN=59dcbfa1-b250-40c4-9f12-3dd38c8dbe74 # Required
      - SUBDOMAINS=newmanson,newmantor,newmannzb,newmanrad,newmanlid # Required
      - LOG_FILE=true #optional
    volumes:
      - ./appdata/duckdns:/config
    restart: unless-stopped
  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
    labels:
      - traefik.enable=true
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080
      - traefik.http.routers.sabnzbd.rule=Host(`newmannzb.duckdns.org`) # Replace with your domain
    volumes:
      - ./appdata/sabnzbd:/config
      - /mnt/downloads:/downloads
      - ./downloads/nzb/incomplete:/incomplete-downloads
      - ../syncs/Sync/nzb:/watch
    restart: unless-stopped
  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
      - UMASK=022 #optional
    labels:
      - traefik.enable=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - traefik.http.routers.radarr.rule=Host(`newmanrad.duckdns.org`) # Replace with your domain
    volumes:
      - ./appdata/radarr:/config
      - /mnt/perceptormedia/Video/Movies:/media
      - /mnt/truemedia/Movies/:/truemedia
      - /mnt/downloads:/downloads
      - /mnt/downloads/torrents/complete:/torrentdownloads
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr:develop
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
      - UMASK=022 #optional
    labels:
      - traefik.enable=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - traefik.http.routers.sonarr.rule=Host(`newmanson.duckdns.org`) # Replace with your domain
    volumes:
      - ./appdata/sonarr:/config
      - /mnt/perceptormedia/Video/TV/:/media
      - /mnt/truemedia/TVShows/:/truemedia
      - /mnt/downloads:/downloads
    restart: unless-stopped
  lidarr:
    image: linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
      - UMASK=022 #optional
    labels:
      - traefik.enable=true
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - traefik.http.routers.lidarr.rule=Host(`newmanlid.duckdns.org`) # Replace with your domain
    volumes:
      - ./appdata/lidarr:/config
      - /mnt/perceptormediaexpansion/Audio/music:/media
      - /mnt/downloads:/downloads
    restart: unless-stopped
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
    volumes:
      - ./appdata/bazarr:/config
      - /mnt/truemedia/Movies:/truemediamovies
      - /mnt/truemedia/TVShows:/truemediatvshows
      - /mnt/perceptormedia/Video/Movies:/Movies
      - /mnt/perceptormedia/Video/TV:/TV
    ports:
      - 6767:6767
    restart: unless-stopped
  vpn:
    image: ghcr.io/bubuntux/nordlynx
    container_name: nordvpn
    cap_add:
      - NET_ADMIN # Required
    environment: # Review https://github.com/bubuntux/nordvpn#environment-variables
      - PRIVATE_KEY=***REMOVED***
      - NET_LOCAL=192.168.0.0/24
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
  torrent:
    image: ghcr.io/linuxserver/qbittorrent
    # image: ghcr.io/linuxserver/qbittorrent:14.3.9
    container_name: qbittorrent
    network_mode: service:vpn
    environment:
      - PUID=1000
      - PGID=1003
      - TZ=America/Chicago
      - WEBUI_PORT=8181
    depends_on:
      - vpn
    labels:
      - traefik.enable=true
      - traefik.http.services.torrent.loadbalancer.server.port=8181
      - traefik.http.routers.torrent.rule=Host(`newmantor.duckdns.org`) # Replace with your domain
    volumes:
      - ./appdata/qbittorrent:/config
      - /mnt/downloads/torrents:/downloads
      - ../syncs/Sync/torrent:/watch
    restart: unless-stopped
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    container_name: recyclarr
    init: true
    user: 1000:1003
    volumes:
      - ./appdata/recyclarr:/config
    environment:
      - TZ=America/Chicago
