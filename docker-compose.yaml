include:
  - compose/auth.yaml
  - compose/downloaders.yaml
  - compose/media-management.yaml
  - compose/gaming.yaml
  - compose/bookmarks.yaml
  - compose/utilities.yaml

services:
  # Linkwarden needs to reach ollama on the LXC (192.168.0.9)
  linkwarden:
    extra_hosts:
      - "ollama:192.168.0.9"
    ports:
      # Need host port for LXC Traefik; 3002 to avoid conflict with convertx (:3000)
      - "3002:3000"
  # Expose authelia host port so LXC Traefik can forward-auth
  authelia:
    ports:
      - "9091:9091"
  # Publish service ports for LXC Traefik proxy
  radarr:
    ports:
      - "7878:7878"
  sonarr:
    ports:
      - "8989:8989"
  lidarr:
    ports:
      - "8686:8686"
  titlecardmaker:
    ports:
      - "4242:4242"
  # sabnzbd has no host port in the base compose
  sabnzbd:
    ports:
      - "8080:8080"
  # qbittorrent uses gluetun's network namespace; port must be published on gluetun
  vpn:
    ports:
      - "8181:8181"  # Pin mariadb to the version that wrote the data dir (LXC ran 12.3.2)
  romm-db:
    image: mariadb:12.3.2
