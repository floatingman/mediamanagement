# Recyclarr — quality-profile sync, as a CronJob (compose ran it on demand).
#
# v8 since 2026-09-22: guide-backed profiles (trash_id in configs/
# hd-bluray-web.yml); no include templates, no repo pin (settings.yml is
# empty — v8 auto-uses official providers). Manages 7 profiles across both
# services: radarr HD Bluray + WEB + the four SQPs, sonarr (instance
# "mainson") WEB-1080p/WEB-2160p. All adopted pre-existing profiles in-place
# (verified: radarr 18 / sonarr 11 profiles, no duplicates). v7 rollback
# bundle: media-k8s-3:/var/tmp/recyclarr-config-backup-20260922.tgz —
# restore configs/ + settings.yml + state/ (v8 rewrote state format) and
# revert this image to 7.4.0.
# Manual run any time:
#   kubectl -n media create job --from=cronjob/recyclarr recyclarr-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  labels: {app: recyclarr}
spec:
  schedule: "0 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: recyclarr}
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000 # compose `user:` parity
            runAsGroup: 1003
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.2
              args: [sync]
              env:
                - {name: TZ, value: America/Chicago}
              volumeMounts:
                - {name: config, mountPath: /config}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
          volumes:
            - name: config
              persistentVolumeClaim: {claimName: recyclarr-config}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: recyclarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
