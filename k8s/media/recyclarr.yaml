# Recyclarr — quality-profile sync, as a CronJob (compose ran it on demand).
# Data migration DONE. Unsuspended 2026-09-20.
#
# Works only with the repo pin in /config/settings.yml (on the
# recyclarr-config PVC): config-templates master dropped includes.json
# (2026-08-07, v8 repo model) which recyclarr 7.4.0 needs for
# `include: - template:` resolution. settings.yml pins the checkout to the
# last populated commit (b323bcae). Do NOT bump the image past 7.x without
# migrating configs — v8 removes official include templates entirely
# (docs: next.recyclarr.dev).
# Manual run any time:
#   kubectl -n media create job --from=cronjob/recyclarr recyclarr-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  labels: {app: recyclarr}
spec:
  schedule: "0 3 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels: {app: recyclarr}
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000 # compose `user:` parity
            runAsGroup: 1003
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:7.4.0
              args: [sync]
              env:
                - {name: TZ, value: America/Chicago}
              volumeMounts:
                - {name: config, mountPath: /config}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
          volumes:
            - name: config
              persistentVolumeClaim: {claimName: recyclarr-config}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: recyclarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
