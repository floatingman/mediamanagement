# profilarr — profile management (beta tag preserved).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  labels: {app: profilarr}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: profilarr}}
  template:
    metadata:
      labels: {app: profilarr}
    spec:
      containers:
        - name: profilarr
          image: santiagosayshey/profilarr:beta
          ports: [{containerPort: 6868}]
          env:
            - {name: TZ, value: America/Chicago}
          volumeMounts:
            - {name: config, mountPath: /config}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: 6868}
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: profilarr-config}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: profilarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: profilarr}
spec:
  selector: {app: profilarr}
  ports: [{port: 6868, targetPort: 6868}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: profilarr}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`profilarr.thenewmans.casa`)
      kind: Rule
      services: [{name: profilarr, port: 6868}]
  tls: {certResolver: letsencrypt}
