# qBittorrent through the VPN — ONE pod, two containers sharing the network
# namespace (the k8s-native version of compose's network_mode: service:vpn).
#
# - gluetun: NET_ADMIN + host /dev/net/tun, userspace wireguard (kernel wg
#   wedged restarts on the old LXC setup; same choice here). NAT-PMP port
#   forwarding stays on. FIREWALL_INPUT_PORTS opens the WebUI port so the
#   cluster ingress (pod CIDR) can reach 8181 through gluetun's iptables.
# - qbittorrent: GSP mod auto-syncs gluetun's forwarded port to the listening
#   port via the localhost control API (needs WebUI "bypass auth for
#   localhost" — carried over in the migrated config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent
  labels: {app: torrent}
spec:
  replicas: 1
  strategy: {type: Recreate} # never two pods fighting over the VPN identity
  selector: {matchLabels: {app: torrent}}
  template:
    metadata:
      labels: {app: torrent}
    spec:
      initContainers:
        # Gluetun k8s gotcha (gluetun-wiki/kubernetes.md): stale ip rules in
        # the pod netns make "adding ip rule 101 ... file exists" fail forever,
        # killing DNS + tunnel setup. Clear them BEFORE gluetun starts.
        - name: clear-ip-rules
          image: busybox:1.36
          command: [sh, -c, "(ip rule del table 51820; ip -6 rule del table 51820) || true"]
          securityContext:
            capabilities:
              add: [NET_ADMIN]
      containers:
        - name: gluetun
          image: qmcgaw/gluetun
          # NOTE: no postStart rule-deletion here — it races gluetun's re-add
          # on container restarts and can delete the LIVE routing rule
          # (traffic then bypasses the tunnel). The initContainer handles
          # stale rules deterministically; if the "ip rule 101: file exists"
          # error returns after gluetun's internal restarts, delete the pod
          # (fresh netns) rather than re-adding a racy hook.
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          env:
            - {name: VPN_SERVICE_PROVIDER, value: protonvpn}
            - {name: VPN_TYPE, value: wireguard}
            - {name: WIREGUARD_IMPLEMENTATION, value: userspace}
            - {name: WIREGUARD_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: media-env, key: PROTONVPN_WIREGUARD_PRIVATE_KEY}}}
            - {name: SERVER_CITIES, value: Chicago}
            # k3s VXLAN (1450) + WireGuard overhead: the discovered 1420 is too
            # big — large packets die with "sendmmsg: message too long".
            - {name: WIREGUARD_MTU, value: "1320"}
            # Cloudflare's default DoT (853) gets connection-RESET from some
            # ProtonVPN exit IPs (datacenter throttling) — gluetun's own
            # healthcheck does DNS lookups, so a bad exit = restart loop.
            # Quad9's DoT has been stable from these exits.
            - {name: DOT_PROVIDER, value: quad9}
            - {name: FIREWALL_INPUT_PORTS, value: "8181"}
            - {name: TZ, value: America/Chicago}
          volumeMounts:
            - {name: gluetun, mountPath: /gluetun}
            - {name: tun, mountPath: /dev/net/tun}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi} # userspace-wg + DoT peaks >512Mi; OOM-killed
            # at 512Mi (node dmesg: anon-rss 521MB) — every kill tore down the
            # TUN fd ("not pollable") and masqueraded as tunnel flapping
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent
          ports: [{containerPort: 8181}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1003"}
            - {name: TZ, value: America/Chicago}
            - {name: WEBUI_PORT, value: "8181"}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: rm, mountPath: /downloads, subPath: Downloads/torrents}
            - {name: rm, mountPath: /watch, subPath: Syncs/torrent}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
        - name: port-sync
          # Replaces the t-anc GSP docker mod (its ghcr fetch returns an
          # invalid tarball): poll gluetun's forwarded port, push it to
          # qBittorrent's listen port via the localhost-bypass WebUI API.
          # Reads the API key from gluetun's own auth config.
          image: curlimages/curl:8.11.1
          command: [sh, /scripts/port-sync.sh]
          volumeMounts:
            - {name: port-sync, mountPath: /scripts, readOnly: true}
            - {name: gluetun, mountPath: /gluetun-ro, readOnly: true}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: port-sync
          configMap:
            name: torrent-port-sync
            defaultMode: 0755
        - name: gluetun
          persistentVolumeClaim: {claimName: gluetun-config}
        - name: config
          persistentVolumeClaim: {claimName: torrent-config}
        - name: rm
          persistentVolumeClaim: {claimName: nfs-ratchetmedia}
---
# ROLLED BACK TO DOCKER VM (2026-09-16): gluetun-in-k8s has an architectural
# healthcheck/DNS-interceptor startup race (see TROUBLESHOOTING.md); the same
# image+key runs perfectly on the VM. The Deployment above is kept scaled to 0
# for a future retry. This selector-less Service preserves the `torrent` DNS
# name the *arr clients use, pointing at the VM's published WebUI port.
apiVersion: v1
kind: Service
metadata:
  name: torrent # same name the *arr clients already use
  namespace: media
spec:
  type: ClusterIP
  ports:
     - port: 8181
       targetPort: 8181
---
apiVersion: v1
kind: Endpoints
metadata:
  name: torrent
  namespace: media
subsets:
  - addresses:
      - ip: 192.168.0.9
    ports:
      - port: 8181
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: torrent-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 2Gi}}
