# lidarr — music library on the expansion share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels: {app: lidarr}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: lidarr}}
  template:
    metadata:
      labels: {app: lidarr}
    spec:
      containers:
        - name: lidarr
          image: linuxserver/lidarr
          ports: [{containerPort: 8686}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1003"}
            - {name: TZ, value: America/Chicago}
            - {name: UMASK, value: "022"}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: pme, mountPath: /media, subPath: Audio/music}
            - {name: syndl, mountPath: /downloads} # Synology volume3/downloads since 2026-09-19
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 4Gi} # 2Gi GC-thrashed on bulk imports (15k-track rescan post-OOM stalled at 88% CPU / 1.5G RSS; DB is 4.5G)
          readinessProbe:
            tcpSocket: {port: 8686}
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: lidarr-config}
        - name: pme
          persistentVolumeClaim: {claimName: nfs-perceptormediaexpansion}
        - name: syndl
          persistentVolumeClaim: {claimName: nfs-synology-downloads}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: lidarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 12Gi}} # 4.5G db + headroom
---
apiVersion: v1
kind: Service
metadata: {name: lidarr}
spec:
  selector: {app: lidarr}
  ports: [{port: 8686, targetPort: 8686}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: lidarr}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`lidarr.thenewmans.casa`)
      kind: Rule
      services: [{name: lidarr, port: 8686}]
  tls: {certResolver: letsencrypt}
