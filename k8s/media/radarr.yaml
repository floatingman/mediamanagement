# radarr — mount table mirrors compose/media-management.yaml exactly:
# /media, /ratchetmedia, /downloads, /torrentdownloads (path parity for the DB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  labels: {app: radarr}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: radarr}}
  template:
    metadata:
      labels: {app: radarr}
    spec:
      containers:
        - name: radarr
          image: linuxserver/radarr
          ports: [{containerPort: 7878}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1003"}
            - {name: TZ, value: America/Chicago}
            - {name: UMASK, value: "002"} # group-writable (share model: group users rw)
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: pm, mountPath: /media, subPath: Video/Movies}
            - {name: rm, mountPath: /ratchetmedia, subPath: Movies}
            - {name: syndl, mountPath: /downloads} # Synology volume3/downloads since 2026-09-19
            - {name: rm, mountPath: /torrentdownloads, subPath: Downloads/torrents/complete}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            tcpSocket: {port: 7878}
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: radarr-config}
        - name: pm
          persistentVolumeClaim: {claimName: nfs-perceptormedia}
        - name: rm
          persistentVolumeClaim: {claimName: nfs-ratchetmedia}
        - name: syndl
          persistentVolumeClaim: {claimName: nfs-synology-downloads}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: radarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: radarr}
spec:
  selector: {app: radarr}
  ports: [{port: 7878, targetPort: 7878}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: radarr}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`radarr.thenewmans.casa`)
      kind: Rule
      services: [{name: radarr, port: 7878}]
  tls: {certResolver: letsencrypt}
