# sonarr — :develop tag preserved from compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels: {app: sonarr}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: sonarr}}
  template:
    metadata:
      labels: {app: sonarr}
    spec:
      containers:
        - name: sonarr
          image: linuxserver/sonarr:develop
          ports: [{containerPort: 8989}]
          env:
            - {name: PUID, value: "1000"}
            - {name: PGID, value: "1003"}
            - {name: TZ, value: America/Chicago}
            - {name: UMASK, value: "002"} # group-writable (share model: group users rw)
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: pm, mountPath: /media, subPath: Video/TV}
            - {name: rm, mountPath: /ratchetmedia, subPath: TVShows}
            - {name: syndl, mountPath: /downloads} # Synology volume3/downloads since 2026-09-19
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          readinessProbe:
            tcpSocket: {port: 8989}
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          persistentVolumeClaim: {claimName: sonarr-config}
        - name: pm
          persistentVolumeClaim: {claimName: nfs-perceptormedia}
        - name: rm
          persistentVolumeClaim: {claimName: nfs-ratchetmedia}
        - name: syndl
          persistentVolumeClaim: {claimName: nfs-synology-downloads}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sonarr-config}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: sonarr}
spec:
  selector: {app: sonarr}
  ports: [{port: 8989, targetPort: 8989}]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: sonarr}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`sonarr.thenewmans.casa`)
      kind: Rule
      services: [{name: sonarr, port: 8989}]
  tls: {certResolver: letsencrypt}
