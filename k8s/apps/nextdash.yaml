# nextDash — no built-in accounts; gated by the authelia forward-auth
# middleware (CRD in the auth namespace), same model as under compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextdash
  labels:
    app: nextdash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextdash
  template:
    metadata:
      labels:
        app: nextdash
    spec:
      containers:
        - name: nextdash
          image: ghcr.io/jordibrouwer/nextdash:latest
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: America/Chicago
          envFrom:
            - secretRef:
                name: apps-env # uses NEXTDASH_WRITE_TOKEN
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextdash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextdash
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextdash
spec:
  selector:
    app: nextdash
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextdash
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dash.thenewmans.casa`)
      kind: Rule
      middlewares:
        - name: authelia
          namespace: auth
      services:
        - name: nextdash
          port: 8080
  tls:
    certResolver: letsencrypt
