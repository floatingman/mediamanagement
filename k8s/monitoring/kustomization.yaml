apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Every manifest carries explicit namespace: metadata (monitoring, except
# nfs-probe in media) — deliberately NO namespace: transformer here so the
# mixed namespaces survive. Apply: kubectl apply -k k8s/monitoring
resources:
  - exportarr.yaml
  - media-alerts.yaml
  - media-dashboard.yaml
  - grafana-ingressroute.yaml
  - nfs-probe.yaml
