# Media Stack dashboard for Grafana — loaded by the kiwigrid sidecar
# (grafana.sidecar.dashboards.enabled: true in kube-prometheus-stack-values).
# Every panel query was verified against live exporter output 2026-09-19;
# exportarr runs WITHOUT additional metrics, so only core series are used
# (sonarr exposes no queue_total in its core set; radarr movie counts are core).
# Edit the JSON below and `kubectl apply -n monitoring -f` to change panels.
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  media-stack.json: |
    {
     "uid": "media-stack",
     "title": "Media Stack",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "1m",
     "time": {
      "from": "now-24h",
      "to": "now"
     },
     "tags": [
      "media",
      "exportarr"
     ],
     "timezone": "browser",
     "panels": [
      {
       "id": 100,
       "title": "Sonarr",
       "type": "stat",
       "gridPos": {
        "h": 4,
        "w": 4,
        "x": 0,
        "y": 0
       },
       "targets": [
        {
         "expr": "sonarr_system_status",
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "mappings": [
          {
           "type": "value",
           "options": {
            "0": {
             "text": "DOWN",
             "color": "red"
            },
            "1": {
             "text": "UP",
             "color": "green"
            }
           }
          }
         ],
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "red",
            "value": null
           },
           {
            "color": "green",
            "value": 0.5
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ]
        },
        "colorMode": "background",
        "graphMode": "none",
        "textMode": "auto_and_name"
       }
      },
