# exportarr (ghcr.io/onedr0p/exportarr) — one instance per *arr app +
# sabnzbd, running in ns monitoring and scraping the ns-media services via
# in-cluster DNS. API keys live in secret exportarr-keys (out-of-band).
# ServiceMonitors carry label release=monitoring to match the Prometheus
# release's serviceMonitorSelector.
#
# Refresh keys after rotating any app's API key:
#   kubectl -n monitoring create secret generic exportarr-keys \
#     --from-literal=radarr=... --from-literal=sonarr=... \
#     --from-literal=lidarr=... --from-literal=sabnzbd=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n monitoring rollout restart deploy -l app.kubernetes.io/name=exportarr
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exportarr-radarr, namespace: monitoring, labels: {app: exportarr-radarr, app.kubernetes.io/name: exportarr}}
spec:
  replicas: 1
  selector: {matchLabels: {app: exportarr-radarr}}
  template:
    metadata: {labels: {app: exportarr-radarr, app.kubernetes.io/name: exportarr}}
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0 # pinned — :latest is invisible to Renovate
          args: [radarr]
          env:
            - {name: PORT, value: "9707"}
            - {name: URL, value: http://radarr.media.svc.cluster.local:7878}
            - {name: APIKEY, valueFrom: {secretKeyRef: {name: exportarr-keys, key: radarr}}}
            # ENABLE_ADDITIONAL_METRICS unset: per-item walks OOM / exceed
            # timeouts; alert rules only use core endpoints (status/health).
            # v2.3.0's BASIC set still ramps to a ~220Mi plateau (library
            # stats walk) — at 256Mi that was OOM whack-a-mole (135 restarts,
            # 2026-09-22). GOMEMLIMIT keeps GC inside the raised limit.
            - {name: GOMEMLIMIT, value: 400MiB}
          ports: [{containerPort: 9707, name: metrics}]
          resources:
            requests: {cpu: 5m, memory: 64Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: exportarr-radarr, namespace: monitoring, labels: {app: exportarr-radarr}}
spec:
  selector: {app: exportarr-radarr}
  ports: [{port: 9707, name: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: exportarr-radarr, namespace: monitoring, labels: {release: monitoring}}
spec:
  selector: {matchLabels: {app: exportarr-radarr}}
  endpoints: [{port: metrics, interval: 120s, scrapeTimeout: 60s}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exportarr-sonarr, namespace: monitoring, labels: {app: exportarr-sonarr, app.kubernetes.io/name: exportarr}}
spec:
  replicas: 1
  selector: {matchLabels: {app: exportarr-sonarr}}
  template:
    metadata: {labels: {app: exportarr-sonarr, app.kubernetes.io/name: exportarr}}
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: [sonarr]
          env:
            - {name: PORT, value: "9708"}
            - {name: URL, value: http://sonarr.media.svc.cluster.local:8989}
            - {name: APIKEY, valueFrom: {secretKeyRef: {name: exportarr-keys, key: sonarr}}}
            # ENABLE_ADDITIONAL_METRICS unset: per-series walks exceed the
            # scrape timeout on this library; core metrics only. Stable at
            # 128Mi (the walks time out before they can balloon).
            - {name: GOMEMLIMIT, value: 100MiB}
          ports: [{containerPort: 9708, name: metrics}]
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: exportarr-sonarr, namespace: monitoring, labels: {app: exportarr-sonarr}}
spec:
  selector: {app: exportarr-sonarr}
  ports: [{port: 9708, name: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: exportarr-sonarr, namespace: monitoring, labels: {release: monitoring}}
spec:
  selector: {matchLabels: {app: exportarr-sonarr}}
  endpoints: [{port: metrics, interval: 120s, scrapeTimeout: 60s}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: exportarr-lidarr, namespace: monitoring, labels: {app: exportarr-lidarr, app.kubernetes.io/name: exportarr}}
spec:
  replicas: 1
  selector: {matchLabels: {app: exportarr-lidarr}}
  template:
    metadata: {labels: {app: exportarr-lidarr, app.kubernetes.io/name: exportarr}}
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: [lidarr]
          env:
            - {name: PORT, value: "9709"}
            - {name: URL, value: http://lidarr.media.svc.cluster.local:8686}
            - {name: APIKEY, valueFrom: {secretKeyRef: {name: exportarr-keys, key: lidarr}}}
            # same v2.3.0 basic-set plateau as radarr (~220Mi on the music
            # library) — was OOM-cycling at 256Mi (121 restarts, 2026-09-22)
            - {name: GOMEMLIMIT, value: 400MiB}
          ports: [{containerPort: 9709, name: metrics}]
          resources:
            requests: {cpu: 5m, memory: 64Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: exportarr-lidarr, namespace: monitoring, labels: {app: exportarr-lidarr}}
spec:
  selector: {app: exportarr-lidarr}
  ports: [{port: 9709, name: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: exportarr-lidarr, namespace: monitoring, labels: {release: monitoring}}
spec:
  selector: {matchLabels: {app: exportarr-lidarr}}
  endpoints: [{port: metrics, interval: 120s, scrapeTimeout: 60s}]
---
