  template:
    metadata: {labels: {app: exportarr-sabnzbd, app.kubernetes.io/name: exportarr}}
    spec:
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0
          args: [sabnzbd]
          env:
            - {name: PORT, value: "9710"}
            - {name: URL, value: http://sabnzbd.media.svc.cluster.local:8080}
            - {name: APIKEY, valueFrom: {secretKeyRef: {name: exportarr-keys, key: sabnzbd}}}
            - {name: GOMEMLIMIT, value: 100MiB}
          ports: [{containerPort: 9710, name: metrics}]
          resources:
            requests: {cpu: 5m, memory: 32Mi}
