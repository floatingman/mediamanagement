# Forward-auth middleware as a native Traefik CRD — single source of truth
# for authelia gating on the cluster edge. Any IngressRoute (any namespace)
# references it as `authelia@kubernetescrd`; the k8s edge ConfigMap's VM
# routers reference it the same way. Cross-namespace use is the reason this
# lives in its own file/namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia
  namespace: auth
spec:
  forwardAuth:
    address: http://authelia.auth.svc.cluster.local:9091/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
