# Edge-transition config: routes subdomains of services still running on the
# Docker VM (192.168.0.9) so *.thenewmans.casa keeps working after the k8s
# Traefik takes over ports 80/443. Mounted into the Traefik pod by the
# k8s/helm/traefik-values.yaml file provider.
#
# WAVE 1 (2026-09-15): authelia, nextdash, convertx, zipline migrated to k8s
# and are served by their IngressRoutes — their routers/services are REMOVED
# here. Duplicate Host rules between this file and an IngressRoute make
# routing undefined; delete from here the moment a service gets an
# IngressRoute. zipline's IngressRoute exists but the pod is down until the
# node CPU model exposes x86-64-v2 (see INSTALL.md troubleshooting).
#
# Cutover-to-k8s-edge rules still live here for VM residents only.
# Gated VM services use the authelia Middleware CRD: authelia@kubernetescrd
# (k8s/auth/middleware.yaml).
#
# CUTOVER RUNBOOK (§9) — when ready to move the edge:
#   1. Label the ingress node (done: media-k8s-1):
#        kubectl label node <node> newman.media/ingress=true
#   2. Foundation + helm releases are installed (see kustomization.yaml).
#   3. These services have NO published host port today (Traefik-only
#      internal) and need host ports for the k8s edge to reach them:
#        searxng:    ports: ["8082:8080"]   (compose/utilities.yaml) — PERMANENT
#        perplexica: ports: ["3002:3000"]   (compose/ai.yaml)        — PERMANENT
#      Their routers below activate at that point (searxng is already
#      active; searxng + perplexica never migrate — GPU-bound via ollama,
#      and the cluster nodes have no NVIDIA GPUs).
#   4. Stop the old edge:
#        docker compose stop proxy
#   5. Move router port-forwards 80/443 from 192.168.0.9 to the ingress
#      node IP. Same LAN / same public IP, so cloudflare-ddns needs no change.
#      (Keep 32400/tcp -> 192.168.0.9 for Plex.)
#   6. As each remaining service migrates to k8s, delete its router AND
#      service blocks below; its IngressRoute takes over. Never keep both.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-external-services
  namespace: traefik
data:
  external-services.yml: |
    http:
      routers:
        radarr:        {rule: Host(`radarr.thenewmans.casa`),        entryPoints: [websecure], service: vm-radarr,        tls: {certResolver: letsencrypt}}
        sonarr:        {rule: Host(`sonarr.thenewmans.casa`),        entryPoints: [websecure], service: vm-sonarr,        tls: {certResolver: letsencrypt}}
        lidarr:        {rule: Host(`lidarr.thenewmans.casa`),        entryPoints: [websecure], service: vm-lidarr,        tls: {certResolver: letsencrypt}}
        bazarr:        {rule: Host(`bazarr.thenewmans.casa`),        entryPoints: [websecure], service: vm-bazarr,        tls: {certResolver: letsencrypt}}
        sabnzbd:       {rule: Host(`sabnzbd.thenewmans.casa`),       entryPoints: [websecure], service: vm-sabnzbd,       tls: {certResolver: letsencrypt}}
        torrent:       {rule: Host(`torrent.thenewmans.casa`),       entryPoints: [websecure], service: vm-torrent,       tls: {certResolver: letsencrypt}}
        seerr:         {rule: Host(`seerr.thenewmans.casa`),         entryPoints: [websecure], service: vm-seerr,         tls: {certResolver: letsencrypt}}
        tautulli:      {rule: Host(`tautulli.thenewmans.casa`),      entryPoints: [websecure], service: vm-tautulli,      tls: {certResolver: letsencrypt}}
        agregarr:      {rule: Host(`agregarr.thenewmans.casa`),      entryPoints: [websecure], service: vm-agregarr,      tls: {certResolver: letsencrypt}}
        tunarr:        {rule: Host(`tunarr.thenewmans.casa`),        entryPoints: [websecure], service: vm-tunarr,        tls: {certResolver: letsencrypt}, middlewares: [authelia@kubernetescrd]}
        cleanuparr:    {rule: Host(`cleanuparr.thenewmans.casa`),    entryPoints: [websecure], service: vm-cleanuparr,    tls: {certResolver: letsencrypt}}
        maintainerr:   {rule: Host(`maintainerr.thenewmans.casa`),   entryPoints: [websecure], service: vm-maintainerr,   tls: {certResolver: letsencrypt}}
        profilarr:     {rule: Host(`profilarr.thenewmans.casa`),     entryPoints: [websecure], service: vm-profilarr,     tls: {certResolver: letsencrypt}}
        titlecardmaker: {rule: Host(`titlecardmaker.thenewmans.casa`), entryPoints: [websecure], service: vm-titlecardmaker, tls: {certResolver: letsencrypt}}
        audiobookshelf: {rule: Host(`audiobookshelf.thenewmans.casa`), entryPoints: [websecure], service: vm-audiobookshelf, tls: {certResolver: letsencrypt}}
        calibre:       {rule: Host(`calibre.thenewmans.casa`),       entryPoints: [websecure], service: vm-calibre,       tls: {certResolver: letsencrypt}}
        romm:          {rule: Host(`romm.thenewmans.casa`),          entryPoints: [websecure], service: vm-romm,          tls: {certResolver: letsencrypt}}
        minecraft:     {rule: Host(`minecraft.thenewmans.casa`),     entryPoints: [websecure], service: vm-minecraft,     tls: {certResolver: letsencrypt}}
        sync:          {rule: Host(`sync.thenewmans.casa`),          entryPoints: [websecure], service: vm-sync,          tls: {certResolver: letsencrypt}}
        # --- Permanent VM residents (GPU-bound via ollama) ---
        search:        {rule: Host(`search.thenewmans.casa`),        entryPoints: [websecure], service: vm-search,        tls: {certResolver: letsencrypt}}
        # perplexica (needs the 3002 host port first):
        # perplexica: {rule: Host(`perplexica.thenewmans.casa`), entryPoints: [websecure], service: vm-perplexica, tls: {certResolver: letsencrypt}, middlewares: [authelia@kubernetescrd]}
      services:
        vm-radarr:         {loadBalancer: {servers: [{url: "http://192.168.0.9:7878"}]}}
        vm-sonarr:         {loadBalancer: {servers: [{url: "http://192.168.0.9:8989"}]}}
        vm-lidarr:         {loadBalancer: {servers: [{url: "http://192.168.0.9:8686"}]}}
        vm-bazarr:         {loadBalancer: {servers: [{url: "http://192.168.0.9:6767"}]}}
        vm-sabnzbd:        {loadBalancer: {servers: [{url: "http://192.168.0.9:8081"}]}}
        vm-torrent:        {loadBalancer: {servers: [{url: "http://192.168.0.9:8181"}]}}
        vm-seerr:          {loadBalancer: {servers: [{url: "http://192.168.0.9:5055"}]}}
        vm-tautulli:       {loadBalancer: {servers: [{url: "http://192.168.0.9:8182"}]}}
        vm-agregarr:       {loadBalancer: {servers: [{url: "http://192.168.0.9:7171"}]}}
        vm-tunarr:         {loadBalancer: {servers: [{url: "http://192.168.0.9:8000"}]}}
        vm-cleanuparr:     {loadBalancer: {servers: [{url: "http://192.168.0.9:11011"}]}}
        vm-maintainerr:    {loadBalancer: {servers: [{url: "http://192.168.0.9:6246"}]}}
        vm-profilarr:      {loadBalancer: {servers: [{url: "http://192.168.0.9:6868"}]}}
        vm-titlecardmaker: {loadBalancer: {servers: [{url: "http://192.168.0.9:4242"}]}}
        vm-audiobookshelf: {loadBalancer: {servers: [{url: "http://192.168.0.9:13378"}]}}
        vm-calibre:        {loadBalancer: {servers: [{url: "http://192.168.0.9:8083"}]}}
        vm-romm:           {loadBalancer: {servers: [{url: "http://192.168.0.9:8090"}]}}
        vm-minecraft:      {loadBalancer: {servers: [{url: "http://192.168.0.9:23333"}]}}
        vm-sync:           {loadBalancer: {servers: [{url: "http://192.168.0.9:8384"}]}}
        vm-search:         {loadBalancer: {servers: [{url: "http://192.168.0.9:8082"}]}}
        # vm-perplexica:   {loadBalancer: {servers: [{url: "http://192.168.0.9:3002"}]}}
