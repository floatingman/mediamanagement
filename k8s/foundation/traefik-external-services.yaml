# Edge-transition config: routes subdomains of services still running on the
# Docker VM (192.168.0.9). Mounted into the Traefik pod by the
# k8s/helm/traefik-values.yaml file provider. At the §9 cutover (2026-09-16)
# this became the authoritative route table for ALL VM residents once the
# router moved 80/443 to this cluster edge (192.168.0.19); the docker
# Traefik keeps running as instant rollback (flip the router back).
#
# Permanent VM residents routed here:
#   torrent (rolled back from k8s — gluetun race, see TROUBLESHOOTING.md)
#   search (searxng), perplexica, minecraft (mcsmanager)
# Plex is host-networking on the VM (app.plex.tv / :32400) — not routed here.
#
# Everything else lives in-cluster behind IngressRoutes.
#
# Duplicate Host rules between this file and an IngressRoute make routing
# undefined; delete from here the moment a service gets an IngressRoute.
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-external-services
  namespace: traefik
data:
  external-services.yml: |
    http:
      serversTransports:
        vm-https-transport:
          # Rancher VM serves its own TLS; the backend URL is an IP so name
          # verification would fail. LAN-only hop.
          insecureSkipVerify: true
      routers:
        rancher:       {rule: Host(`rancher.thenewmans.casa`),       entryPoints: [websecure], service: vm-rancher,       tls: {certResolver: letsencrypt}}
        torrent:       {rule: Host(`torrent.thenewmans.casa`),       entryPoints: [websecure], service: vm-torrent,       tls: {certResolver: letsencrypt}}
        search:        {rule: Host(`search.thenewmans.casa`),        entryPoints: [websecure], service: vm-search,        tls: {certResolver: letsencrypt}}
        minecraft:     {rule: Host(`minecraft.thenewmans.casa`),     entryPoints: [websecure], service: vm-minecraft,     tls: {certResolver: letsencrypt}}
        # perplexica + nostalgiatv live in IngressRoutes (vm-resident-routes.yaml):
        # file-provider routes can't reference the authelia CRD middleware
      services:
        vm-rancher:        {loadBalancer: {serversTransport: vm-https-transport, servers: [{url: "https://192.168.0.22:443"}]}}
        vm-torrent:        {loadBalancer: {servers: [{url: "http://192.168.0.9:8181"}]}}
        vm-search:         {loadBalancer: {servers: [{url: "http://192.168.0.9:8082"}]}}
        vm-perplexica:     {loadBalancer: {servers: [{url: "http://192.168.0.9:3002"}]}}
        vm-minecraft:      {loadBalancer: {servers: [{url: "http://192.168.0.9:23333"}]}}
