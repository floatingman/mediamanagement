# kube-prometheus-stack — upstream Prometheus + Grafana + Alertmanager +
# node-exporter + kube-state-metrics for the 3-node media cluster.
# Deliberately NOT Rancher's repackaged chart: this way Renovate/update-day.sh
# track upstream versions and nothing depends on the Rancher VM.
#
# Install / upgrade:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring -f k8s/helm/kube-prometheus-stack-values.yaml
#
# Secrets (created out-of-band, never committed):
#   alertmanager-main  (key alertmanager.yaml) — receiver config. Telegram
#     wired 2026-09-19 (bot + chat id live only in that secret). After editing
#     it, bounce the pod — the operator does NOT hot-watch the source secret:
#     kubectl -n monitoring delete pod alertmanager-monitoring-kube-prometheus-alertmanager-0
#     (Also: the operator's generated secret stores alertmanager.yaml GZIPPED
#     — grepping .data.alertmanager.yaml decodes garbage; check the live
#     config via the API: /api/v2/status → config.original.)
# Storage: all TSDB/dashboards on local-path PVCs (node-pinned; losing a node
# loses only that node's monitoring history — fine for this stack).
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests: {cpu: 200m, memory: 400Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources: {requests: {storage: 30Gi}}

alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-main
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources: {requests: {storage: 2Gi}}

grafana:
  # Password: the chart auto-generates and mounts a secret (no value in git).
  # Retrieve: kubectl -n monitoring get secret -l app.kubernetes.io/component=admin-secret
  #   -o jsonpath='{.items[0].data.admin-password}' | base64 -d
  # (2026-09-20: these keys sat mis-nested under alertmanager: since install —
  # inert, grafana ran on defaults/emptyDir. Moved here for real persistence.)
  adminUser: admin
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  ingress:
    enabled: false # exposed via IngressRoute CRD — k8s/monitoring/
  sidecar:
    dashboards:
      enabled: true

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# k3s embeds controller-manager, scheduler, and kube-proxy in the server
# binary — no separate scrapeable static pods. Their ServiceMonitors never
# get targets, so KubeControllerManagerDown / KubeSchedulerDown /
# KubeProxyDown fired permanently since install. Components + rule groups
# off (2026-09-20). kubelet/apiserver/coredns/etcd monitors stay — those
# ARE scrapeable on k3s.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kube-state-metrics:
  # Expose PVC labels (kube_persistentvolumeclaim_labels) so the default
  # KubePersistentVolumeFillingUp rules honor the excluded_from_alerts
  # opt-out — set on the multi-TB NFS PVCs (k8s/media/nfs-pvcs.yaml), whose
  # percent-based "filling up" semantics are noise (3% of volume1 = ~3TiB).
  # Absolute-bytes replacements live in k8s/monitoring/media-alerts.yaml.
  metricLabelsAllowlist:
    - persistentvolumeclaims=[*]
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 96Mi}

# Default rule groups (NodeFilesystemAlmostOutOfSpace, KubePodCrashLooping,
# KubeJobFailed, NodeDown, ...) stay enabled — they cover this cluster's real
# incident classes. KubePersistentVolumeFillingUp still covers the small
# local-path PVCs; the big NFS shares opt out per-PVC via the label above.
# Custom media-stack rules live in k8s/monitoring/media-alerts.yaml.
# The three control-plane groups are dead on k3s (see component note above).
defaultRules:
  create: true
  rules:
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false
