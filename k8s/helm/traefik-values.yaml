# Traefik v3 helm release — k8s replacement for the Docker-VM edge.
#
# Ports 80/443 are hostPorts on EVERY control-plane node (all three carry the
# newman.media/ingress=true label since 2026-09-26). Each replica binds its
# own node's 80/443; the Docker-VM edge (traefik-dyn/transition.yaml) loads
# balances across all node IPs with health checks. One replica per node via
# podAntiAffinity — any single node loss leaves two edges serving.
#
# Cert continuity model: NO shared acme.json (an RWO PVC can't span 3
# replicas). Each replica issues its own certs via DNS-01 against Cloudflare
# (cheap, no HTTP validation limits), so replicas never need to share state.
# Fresh pods re-issue on start; brief self-signed window per new pod.
deployment:
  kind: Deployment
  replicas: 3
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [traefik]
        topologyKey: kubernetes.io/hostname
nodeSelector:
  newman.media/ingress: "true"
service:
  type: ClusterIP
ports:
  web:
    port: 8000
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    port: 8443
    hostPort: 443
    http:
      tls:
        enabled: true
        # every router serves the wildcard secret (thenewmans-certs) issued
        # by cert-manager — see k8s/foundation/cert-manager.yaml
  traefik:
    port: 9000
# Dashboard: NOT exposed (hardening — the docker edge published :8080 wide
# open). Reach it ad hoc with:
#   kubectl -n traefik port-forward deploy/traefik 9000:9000
#   http://localhost:9000/dashboard/
api:
  dashboard: true
# The authelia Middleware CRD lives in the auth namespace; IngressRoutes in
# other namespaces reference it (e.g. nextdash in apps).
providers:
  kubernetesCRD:
    allowCrossNamespace: true

additionalArguments:
  - --providers.file.directory=/etc/traefik/dynamic
  - --providers.file.watch=true
# Per-replica ephemeral /data (acme.json): no shared PVC — see header. The
# pre-2026-09-26 acme PVC (named "traefik") was deleted at cutover.
persistence:
  enabled: false
# Transition routing: subdomains still served by the Docker VM, plus the
# authelia-vm forward-auth middleware (k8s/foundation/…-services.yaml
# ConfigMap, which MUST be applied before the helm release).
volumes:
  - name: traefik-external-services
    mountPath: /etc/traefik/dynamic
    type: configMap
  # wildcard cert (tls.crt/tls.key) for the file-provider VM routes —
  # issued by cert-manager, see k8s/foundation/cert-manager.yaml
  - name: thenewmans-certs
    mountPath: /certs
    type: secret
