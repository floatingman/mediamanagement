# Rancher server (web GUI for the cluster). Chart: rancher-latest/rancher
# (kubeVersion "< 1.37.0-0" — matches our k3s v1.36.4).
#
# Install (bootstrapPassword passed via --set so it never lands in git):
#   helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
#   helm install rancher rancher-latest/rancher -n cattle-system --create-namespace \
#     -f k8s/helm/rancher-values.yaml --set bootstrapPassword=<random>
#
# Single replica: homelab sizing. Scale to 3 with `helm upgrade ... --set replicas=3`
hostname: rancher.thenewmans.casa
replicas: 1

# TLS: Traefik (our edge) terminates with a Let's Encrypt cert via the same
# DNS-01 resolver as everything else. The chart still creates its self-signed
# tls-rancher-ingress secret (ingress.tls.source default), but the traefik
# router annotation overrides which cert actually gets served.
# rancher.auditLog left off (homelab).
ingress:
  ingressClassName: traefik
  extraAnnotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
